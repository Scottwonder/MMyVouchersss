{% extends 'voucher_app/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card p-4">
            <h4>Forgot Password</h4>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary">Send Reset Instructions</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
