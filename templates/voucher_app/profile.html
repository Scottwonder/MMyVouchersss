{% extends 'voucher_app/base.html' %}
{% block content %}
<div class="card p-4">
    <h4>Profile</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
            <button class="btn btn-primary">Save</button>
            <a href="{% url 'change-password' %}" class="btn btn-outline-secondary">Change Password</a>
        </div>
    </form>
</div>
{% endblock %}
