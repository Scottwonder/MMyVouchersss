{% extends 'voucher_app/base.html' %}
{% block content %}
<div class="card p-4">
    <h4>Delete User</h4>
    <p>Are you sure you want to delete {{ object.username }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'user-list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
